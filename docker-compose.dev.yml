version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tes-mvp-app-dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.env
    depends_on:
      - db
    networks:
      - tes-network
    restart: unless-stopped
    command: npm run dev

  db:
    image: postgres:15-alpine
    container_name: tes-mvp-db-dev
    environment:
      POSTGRES_DB: tes_mvp_dev
      POSTGRES_USER: tes_user_dev
      POSTGRES_PASSWORD: tes_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init.dev.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tes-network
    restart: unless-stopped

volumes:
  postgres_data_dev:

networks:
  tes-network:
    driver: bridge