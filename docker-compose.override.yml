version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tes-mvp-app-dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://tes_user:tes_password@tes-mvp-db:5432/tes_mvp
      - JWT_SECRET=${JWT_SECRET}
      - RAILWAY_ENVIRONMENT=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.env
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tes-network
    restart: unless-stopped
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: tes-mvp-db-dev
    environment:
      POSTGRES_DB: tes_mvp
      POSTGRES_USER: tes_user
      POSTGRES_PASSWORD: tes_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tes_user -d tes_mvp"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: tes-mvp-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - tes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Development tools
  adminer:
    image: adminer
    container_name: tes-mvp-adminer
    ports:
      - "8080:8080"
    networks:
      - tes-network
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: tes-mvp-db
      ADMINER_DESIGN: "nette"

  # Visualizer for docker-compose
  visualizer:
    image: dockersamples/visualizer:stable
    container_name: tes-mvp-visualizer
    ports:
      - "8081:8080"
    networks:
      - tes-network
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tes-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16