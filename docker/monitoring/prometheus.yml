global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

scrape_configs:
  - job_name: 'tes-mvp-app'
    static_configs:
      - targets: ['tes-mvp-app:3001']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: 'tes-mvp-redis'
    static_configs:
      - targets: ['tes-mvp-redis:6379']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'tes-mvp-db'
    static_configs:
      - targets: ['tes-mvp-db:5432']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'tes-mvp-nginx'
    static_configs:
      - targets: ['tes-mvp-nginx:80']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  - job_name: 'grafana'
    static_configs:
      - targets: ['tes-mvp-grafana:3000']
    scrape_interval: 30s