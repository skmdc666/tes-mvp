# PostgreSQL Host-Based Authentication configuration

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Allow local connections
local   all             all                                     trust

# Allow IPv4 connections from localhost
host    all             all             127.0.0.1/32            scram-sha-256

# Allow IPv6 connections from localhost
host    all             all             ::1/128                 scram-sha-256

# Allow connections from Docker network (172.20.0.0/16)
host    tes_mvp         tes_user        172.20.0.0/16           scram-sha-256
host    all             all             172.20.0.0/16           scram-sha-256

# Allow connections from application container
host    tes_mvp         tes_user        172.20.0.2/32            scram-sha-256
host    all             all             172.20.0.2/32            scram-sha-256

# Allow replication connections (if needed)
# host    replication     all             172.20.0.0/16            scram-sha-256

# Require SSL for all remote connections
hostssl all             all             0.0.0.0/0               scram-sha-256

# Disallow non-SSL connections for remote users
hostnossl all           all             0.0.0.0/0               reject